  function svgFor(id) {

  function mouthGeom(open, wide, round) {
    var smile = wide * (1 - round);
    var hw = 34 + smile * 46 + round * 6;
    var lift = 5 + smile * 18;
    var gap = 4 + open * (34 + round * 12);
    var yL = -lift * 0.2 * (1 - round);
    var yR = -lift * 0.62 * (1 - round) - round * 2;
    var top = -gap * (0.42 + round * 0.2) - 1.5;
    var bot = gap * (0.82 + round * 0.08);
    var xL = -hw, xR = hw;
    var bow = hw * (0.2 + round * 0.45);
    var hole = "M " + (xL + 1) + " " + yL
      + " C " + (-bow) + " " + (top - 3) + " " + bow + " " + (top - 3) + " " + (xR - 1) + " " + yR
      + " C " + (xR * 0.72) + " " + (bot * 0.3) + " " + (bow * 0.6) + " " + (bot + 2) + " 0 " + bot
      + " C " + (-bow * 0.6) + " " + (bot + 2) + " " + (xL * 0.72) + " " + (bot * 0.3) + " " + (xL + 1) + " " + yL + " Z";
    var upper = "M " + xL + " " + (yL - 1)
      + " C " + (-bow) + " " + (top - 10) + " " + bow + " " + (top - 10) + " " + xR + " " + (yR - 1)
      + " C " + (bow * 0.45) + " " + (top + 2) + " " + (-bow * 0.45) + " " + (top + 2) + " " + xL + " " + (yL - 1) + " Z";
    var lower = "M " + (xL + 1) + " " + (yL + 1)
      + " C " + (-bow * 0.3) + " " + (bot * 0.22) + " " + (bow * 0.3) + " " + (bot * 0.18) + " " + (xR - 1) + " " + (yR + 1)
      + " C " + bow + " " + (bot + 8) + " " + (-bow) + " " + (bot + 9) + " " + (xL + 1) + " " + (yL + 1) + " Z";
    var line = "M " + (xL + 5) + " " + yL + " Q 0 " + (top + 1) + " " + (xR - 5) + " " + yR;
    var toothH = Math.max(2.2, gap) * (0.42 - round * 0.18);
    var inset = hw * (0.16 + round * 0.12);
    var teeth = "M " + (xL + inset) + " " + (top + 0.5)
      + " Q 0 " + (top - 1) + " " + (xR - inset) + " " + (top + 1.2)
      + " L " + (xR - inset) + " " + (top + toothH)
      + " Q 0 " + (top + toothH + 2) + " " + (xL + inset) + " " + (top + toothH) + " Z";
    return { hole: hole, upper: upper, lower: lower, line: line, teeth: teeth, hw: hw, top: top, bot: bot, gap: gap };
  }

  function sample(t, keys) {
    var dur = keys[keys.length - 1].t;
    var tt = ((t % dur) + dur) % dur;
    var i = 0;
    while (i < keys.length - 2 && keys[i + 1].t <= tt) i++;
    var a = keys[i], b = keys[i + 1];
    var u = (tt - a.t) / Math.max(0.0001, b.t - a.t);
    var s = u * u * (3 - 2 * u);
    var o = {};
    for (var k in a) {
      if (k === "t") continue;
      o[k] = a[k] + (b[k] - a[k]) * s;
    }
    return o;
  }

  function gazeAt(t, keys) {
    var dur = keys[keys.length - 1].t;
    var tt = ((t % dur) + dur) % dur;
    var i = 0;
    while (i < keys.length - 2 && keys[i + 1].t <= tt) i++;
    var a = keys[i], b = keys[i + 1];
    var start = b.t - 0.12;
    if (tt <= start || b.t <= a.t) return { x: a.x, y: a.y };
    var u = Math.min(1, (tt - start) / 0.12);
    var s = 1 - Math.pow(1 - u, 3);
    return { x: a.x + (b.x - a.x) * s, y: a.y + (b.y - a.y) * s };
  }

  function blinkAmt(t, ev, eye) {
    var best = 0;
    var tt = ((t % 28) + 28) % 28;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.single && e.lead !== eye) continue;
      var start = e.t + (e.lead === eye ? 0 : e.lag);
      var u = (tt - start) / e.dur;
      if (u < 0 || u > 1) {
        var u2 = ((tt + 28) - start) / e.dur;
        if (u2 < 0 || u2 > 1) continue;
        u = u2;
      }
      var k = u < 0.32 ? Math.sin((u / 0.32) * Math.PI / 2) : Math.cos(((u - 0.32) / 0.68) * Math.PI / 2);
      if (k > best) best = k;
    }
    return best;
  }

  function buildMouth(p, rnd) {
    var keys = p.mouthIntro.map(function (k) { return { t: k.t, open: k.open, wide: k.wide, round: k.round }; });
    var t = keys[keys.length - 1].t;
    var rest = p.rest;
    while (t < 27.2) {
      if (rnd() < p.talk) {
        var syl = 3 + Math.floor(rnd() * 5);
        for (var s = 0; s < syl; s++) {
          keys.push({ t: t, open: 0.05 + rnd() * 0.08, wide: 0.16 + rnd() * 0.2, round: rnd() * 0.15 });
          t += 0.05 + rnd() * 0.035;
          var v = p.vowels[Math.floor(rnd() * p.vowels.length)];
          var j = 0.82 + rnd() * 0.28;
          keys.push({
            t: t,
            open: Math.min(1, v.open * j),
            wide: Math.min(1, v.wide * (0.88 + rnd() * 0.16)),
            round: Math.min(1, v.round)
          });
          t += 0.09 + rnd() * 0.08;
        }
        keys.push({ t: t, open: rest.open, wide: rest.wide, round: rest.round });
        t += 0.22 + rnd() * 0.55;
      } else {
        keys.push({ t: t, open: rest.open, wide: rest.wide * (0.85 + rnd() * 0.2), round: rest.round });
        t += 0.45 + rnd() * 0.5;
      }
    }
    keys.push({ t: 28, open: rest.open, wide: rest.wide, round: rest.round });
    return keys;
  }

  function buildGaze(p, rnd) {
    var keys = p.gazeIntro.map(function (k) { return { t: k.t, x: k.x, y: k.y }; });
    var t = keys[keys.length - 1].t;
    while (t < 27.2) {

    return keys;
  }

    var ev = [];
    var t = 2.15;
    ev.push({ t: 0.38, dur: 0.16, lead: 0, lag: 0.045, single: false });
    while (t < 27.4) {
      var single = rnd() < 0.18;
      var lead = rnd() < 0.5 ? 0 : 1;
      ev.push({
        t: t,
        dur: 0.11 + rnd() * 0.06,
        lead: lead,
        lag: 0.028 + rnd() * 0.05,
        single: single
      });
      if (!single && rnd() < (p.id === "ascolto" ? 0.28 : 0.14)) {
        ev.push({ t: t + 0.2, dur: 0.1, lead: lead, lag: 0.03, single: false });
      }
      t += (p.id === "voce" ? 2.4 : 1.7) + rnd() * 1.8;
    }
    return ev;
  }

  function buildHead(p, rnd) {
    var keys = p.headIntro.map(function (k) { return { t: k.t, x: k.x, y: k.y, r: k.r }; });
    var t = keys[keys.length - 1].t;
    while (t < 27.2) {
      keys.push({
        t: t,
        x: (rnd() * 2 - 1) * p.turn,
        y: (rnd() * 1.4 - 0.2) * (p.id === "voce" ? 0.85 : 0.45),
        r: (rnd() * 2 - 1) * p.tilt
      });
      t += p.headHold + rnd() * p.headSpan;
    }
    keys.push({ t: 28, x: 0, y: 0, r: 0 });
    return keys;
  }

  function clampEye(dx, dy, eye) {
    var ax = Math.max(2, eye.rx - eye.iris - 1.2);
    var ay = Math.max(1.6, eye.ry - eye.iris - 1.1);
    var n = Math.hypot(dx / ax, dy / ay);
    if (n > 1) { dx /= n; dy /= n; }
    return [dx, dy];
  }

  function applyMouth(face, m) {
    var g = mouthGeom(m.open, m.wide, m.round);
    face.upper.setAttribute("d", g.upper);
    face.hole.setAttribute("d", g.hole);
    face.holeclip.setAttribute("d", g.hole);
    face.lower.setAttribute("d", g.lower);
    face.line.setAttribute("d", g.line);
    face.teeth.setAttribute("d", g.teeth);
    face.teeth.style.opacity = m.open > 0.22 && m.round < 0.75 ? "1" : "0";
    face.tongue.setAttribute("cx", "1");
    face.tongue.setAttribute("cy", String(g.top + g.gap * 0.72));
    face.tongue.setAttribute("rx", String(Math.max(6, g.hw * 0.34)));
    face.tongue.setAttribute("ry", String(Math.max(2, g.gap * 0.22)));
    face.tongue.style.opacity = m.open > 0.45 ? "1" : "0";
    var gaps = "";
    if (m.open > 0.28 && m.round < 0.7) {
      var n = 4;
      for (var i = 0; i < n; i++) {
        var x = (i - (n - 1) / 2) * g.hw * 0.26;
        gaps += '<line x1="' + x + '" y1="' + (g.top + 1) + '" x2="' + x + '" y2="' + (g.top + g.gap * 0.4) + '"/>';
      }
    }
    if (face.gapsHTML !== gaps) { face.gaps.innerHTML = gaps; face.gapsHTML = gaps; }
    var jaw = m.open * 8;
    face.mouth.setAttribute("transform", "translate(" + MOUTH.x + " " + (MOUTH.y + jaw) + ") rotate(" + MOUTH.rot + ")");
  }

  function applyLids(face, closes, squint) {
    for (var i = 0; i < 2; i++) {
      var e = EYES[i];
      var amount = Math.min(1, closes[i] + squint * (1 - closes[i]));
      var R = e.rx * 1.5;
      var bottom = (e.cy - e.ry) + e.ry * 2 * (0.03 + amount * 0.97);
      face.lid[i].setAttribute("cy", String(bottom - R));
      var R2 = e.rx * 1.25;
      var topEdge = (e.cy + e.ry) - squint * e.ry * 0.7;
      face.low[i].setAttribute("cy", String(topEdge + R2));
    }
  }

  function mount(card, p) {
    var rnd = mulberry32(p.seed * 97);
    var rig = card.querySelector(".rig");
    rig.innerHTML = '<img alt="" src="' + IMG + '" width="410" height="700">' + svgFor(p.id);
    var svg = rig.querySelector("svg");
    var face = {
      rig: rig,
      mouth: svg.querySelector(".mouth"),
      iris: [svg.querySelector(".eye0 .iris"), svg.querySelector(".eye1 .iris")],
      lid: [svg.querySelector(".eye0 .lid"), svg.querySelector(".eye1 .lid")],
      low: [svg.querySelector(".eye0 .low"), svg.querySelector(".eye1 .low")],
      upper: svg.querySelector(".upper"),
      hole: svg.querySelector(".hole"),
      holeclip: svg.querySelector(".holeclip"),
      lower: svg.querySelector(".lower"),
      line: svg.querySelector(".line"),
      teeth: svg.querySelector(".teeth"),
      tongue: svg.querySelector(".tongue"),
      gaps: svg.querySelector(".gaps"),
      gapsHTML: ""
    };
    var mouthKeys = buildMouth(p, rnd);
    var gazeKeys = buildGaze(p, rnd);
    var blinks = buildBlinks(p, rnd);
    var headKeys = buildHead(p, rnd);
    return function (t) {
      var m = sample(t, mouthKeys);
      var g = gazeAt(t, gazeKeys);
      g.x += Math.sin(t * 1.3 + p.seed) * 0.03;
      g.y += Math.sin(t * 0.85 + p.seed) * 0.025;
      var d0 = clampEye(g.x * p.gazePx, g.y * p.gazePx * 0.7, EYES[0]);
      var d1 = clampEye(g.x * p.gazePx * 0.92, g.y * p.gazePx * 0.7, EYES[1]);
      face.iris[0].setAttribute("transform", "translate(" + d0[0].toFixed(2) + " " + d0[1].toFixed(2) + ")");
      face.iris[1].setAttribute("transform", "translate(" + d1[0].toFixed(2) + " " + d1[1].toFixed(2) + ")");
      var closes = [blinkAmt(t, blinks, 0), blinkAmt(t, blinks, 1)];
      var smile = Math.max(0, m.wide - 0.6) * (1 - m.round);
      applyLids(face, closes, smile * 0.22);
      applyMouth(face, m);
      if (!reduce) {
        var h = sample(t, headKeys);
        var driftX = Math.sin(t * 0.37 + p.seed) * 1.4;
        var driftY = Math.sin(t * 0.51 + p.seed * 1.3) * 1.1;
        var hx = h.x * p.headPx + driftX;
        var hy = h.y * p.headPx * 0.75 + driftY;
        var hr = h.r + Math.sin(t * 0.23 + p.seed) * 0.35;
        face.rig.style.transform = "translate(" + hx.toFixed(2) + "px," + hy.toFixed(2) + "px) rotate(" + hr.toFixed(2) + "deg)";
      }
    };
  }

  var root = document.getElementById("faces");
  PROFILES.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    b.setAttribute("data-id", p.id);
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = ''
      + '<span class="stage"><span class="crop"><span class="rig"></span></span></span>'
      + '<span class="meta"><span class="name"><span class="num" style="background:' + p.color + '">' + p.n + '</span>'
      + p.name + '<span class="pick">Scelta</span></span><p>' + p.line + '</p></span>';
    root.appendChild(b);
  });

  var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));
  var frames = cards.map(function (c, i) { return mount(c, PROFILES[i]); });

  function select(id) {
    cards.forEach(function (c) {
      var on = c.getAttribute("data-id") === id;
      c.classList.toggle("is-on", on);
      c.setAttribute("aria-pressed", on ? "true" : "false");
    });
    try { sessionStorage.setItem("seedelisa-faccia-2", id); } catch (e) {}
  }
  cards.forEach(function (c) {
    c.addEventListener("click", function () { select(c.getAttribute("data-id")); });
  });

  if (reduce) {
    frames.forEach(function (fn) { fn(0.55); });
    return;
  }
  var t0 = performance.now();
  function loop(now) {
    var t = (now - t0) / 1000;
    if (SHOT && t >= SHOT_T) {
      frames.forEach(function (fn) { fn(SHOT_T); });
      document.documentElement.setAttribute("data-ready", "1");
      return;
    }
    frames.forEach(function (fn) { fn(t); });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
