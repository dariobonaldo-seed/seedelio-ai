<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo variante 4, dondolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: #0f172a;
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 28px 80px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .lead {
    margin: 0 0 36px;
    color: #475569;
    font-size: 16px;
    line-height: 1.45;
  }
  .lockup {
    position: relative;
    width: 226px;
    height: 48px;
    overflow: hidden;
  }
  .line {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 2;
    width: 226px;
    height: 1px;
    background: #64748b;
    transform-origin: left center;
    transform: scaleX(0);
    animation: lineGrow 10s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  .mark {
    position: absolute;
    left: 0;
    top: 1px;
    z-index: 1;
    display: block;
    overflow: hidden;
  }
  .word {
    position: absolute;
    left: 110px;
    top: 7px;
    z-index: 1;
    font-size: 30px;
    font-weight: 600;
    color: #334155;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .seed {
    transform-box: view-box;
    transform-origin: 50% 0;
  }
  .s1 { transform-origin: 33.17% 0; animation: rock 7.2s ease-in-out infinite; }
  .s2 { transform-origin: 71.14% 0; animation: rock 7.2s ease-in-out infinite reverse; }
  .s3 { transform-origin: 56.39% 0; animation: rock 7.2s ease-in-out infinite .8s; }
  @keyframes lineGrow {
    0% { transform: scaleX(0); }
    36% { transform: scaleX(1); }
    74% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }
  @keyframes rock {
    0%, 100% { transform: rotate(-2.5deg); }
    50% { transform: rotate(2.5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .line { transform: none; animation: none; }
    .seed { animation: none !important; transform: none !important; }
  }
</style>
</head>
